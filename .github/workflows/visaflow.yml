name: VisaFlow domain
on:
  push:
    branches: [main]
    paths: ['packages/visa-domain/**', 'packages/session-tools-core/**', 'packages/shared/src/prompts/**', '.github/workflows/visaflow.yml']
  pull_request:
    paths: ['packages/visa-domain/**', 'packages/session-tools-core/**', 'packages/shared/src/prompts/**', '.github/workflows/visaflow.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/visa-domain/package-lock.json
      - run: npm ci --ignore-scripts --workspaces=false
        working-directory: packages/visa-domain
      - run: npm run typecheck
        working-directory: packages/visa-domain
      - name: Install pinned local OCR language models
        run: npm run setup:ocr
        working-directory: packages/visa-domain
      - name: Install CJK fonts for synthetic OCR fixtures
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: node --experimental-strip-types --test packages/visa-domain/src/*.test.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install locked host and MCP build dependencies without scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate retrieval, tool schema and safe-mode registry
        run: bun test packages/session-tools-core/src/handlers/visa-search-rules.test.ts packages/session-tools-core/src/tool-defs-filtering.test.ts
      - name: Verify bundled Node and Bun document adapters
        run: bun test packages/visa-domain/scripts/bundle.test.ts
      - name: Re-evaluate fixtures and replay traces after rule/prompt/tool changes
        run: node --experimental-strip-types packages/visa-domain/src/eval.ts visaflow-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visaflow-evaluation
          path: visaflow-eval.json
